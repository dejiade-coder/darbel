services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: darbel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me_superuser
    volumes:
      - darbel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d darbel"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - darbel-storage:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  darbel-postgres:
  darbel-storage:
